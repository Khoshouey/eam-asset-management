<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR-Linked Asset PM Manager</title>
  <style>
    :root {
      --primary: #0056b3;
      --bg: #f4f7f6;
      --card: #ffffff;
      --border: #cccccc;
      --text: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    h2, h3 {
      margin-top: 0;
      color: var(--primary);
    }

    .qr-banner {
      background: #e7f3ff;
      border-left: 5px solid var(--primary);
      padding: 12px 15px;
      margin-bottom: 20px;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
    }

    label {
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }

    input, select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.95rem;
    }

    input[readonly] {
      background-color: #e9ecef;
      color: #495057;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f0f0f0;
      font-size: 0.85rem;
    }

    td input {
      width: 90%;
      border: none;
      background: transparent;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-test {
      background-color: #28a745;
      font-size: 0.85rem;
      padding: 6px 12px;
    }

    .btn-danger {
      background-color: #dc3545;
      padding: 5px 10px;
    }

    pre {
      background: #272822;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.85rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Asset PM Automated Data Loader</h2>

  <!-- QR Scan Detection Notification Header -->
  <div class="qr-banner">
    <div>
      <strong>QR Status:</strong> <span id="qrStatusText">Parsing URL Parameters...</span>
    </div>
    <div>
      <small>Simulate QR Scan: </small>
      <button class="btn btn-test" onclick="simulateQRScan('2803', 'ENGINE')">Engine (2803)</button>
      <button class="btn btn-test" onclick="simulateQRScan('123456', 'PUMP')">Pump (123456)</button>
      <button class="btn btn-test" onclick="simulateQRScan('78910', 'COMPRESSOR')">Compressor (78910)</button>
    </div>
  </div>

  <form id="pmForm">
    <!-- Header / Asset Type Identification -->
    <div class="card">
      <div class="grid-2">
        <div class="form-group">
          <label for="pmId">PM ID (From QR)</label>
          <input type="text" id="pmId" readonly>
        </div>
        <div class="form-group">
          <label for="equipmentType">Equipment Category (Auto-Detected)</label>
          <input type="text" id="equipmentType" readonly style="font-weight: bold; color: var(--primary);">
        </div>
      </div>
    </div>

    <!-- Base Asset Info -->
    <div class="card">
      <h3>Base Record Info</h3>
      <div class="grid-3">
        <div class="form-group">
          <label for="asset">Asset Description</label>
          <input type="text" id="asset">
        </div>
        <div class="form-group">
          <label for="assetTag">Asset Tag</label>
          <input type="text" id="assetTag">
        </div>
        <div class="form-group">
          <label for="assetLocation">Location</label>
          <input type="text" id="assetLocation" value="RBKR">
        </div>
        <div class="form-group">
          <label for="manufacturer">Manufacturer</label>
          <input type="text" id="manufacturer">
        </div>
        <div class="form-group">
          <label for="model">Model</label>
          <input type="text" id="model">
        </div>
        <div class="form-group">
          <label for="serial">Serial No</label>
          <input type="text" id="serial">
        </div>
        <div class="form-group">
          <label for="jobPlan">Job Plan</label>
          <input type="text" id="jobPlan">
        </div>
        <div class="form-group">
          <label for="workOrder">Work Order</label>
          <input type="text" id="workOrder">
        </div>
        <div class="form-group">
          <label for="pmFrequencySummary">Frequency Summary</label>
          <input type="text" id="pmFrequencySummary">
        </div>
      </div>
    </div>

    <!-- Dynamic Equipment Specifications Container -->
    <div class="card">
      <h3 id="specsHeader">Technical Parameters</h3>
      
      <!-- ENGINE FIELDS -->
      <div id="engineFields" class="grid-3 hidden">
        <div class="form-group">
          <label for="eng_ratedPower">Rated Power</label>
          <input type="text" id="eng_ratedPower" value="1480 HP / 1100 KW">
        </div>
        <div class="form-group">
          <label for="eng_operatingSpeed">Operating Speed</label>
          <input type="text" id="eng_operatingSpeed" value="1200 RPM">
        </div>
        <div class="form-group">
          <label for="eng_fuelType">Fuel Type</label>
          <input type="text" id="eng_fuelType" value="Natural Gas / LPG">
        </div>
        <div class="form-group">
          <label for="eng_cylindersCount">Cylinders Count</label>
          <input type="number" id="eng_cylindersCount" value="12">
        </div>
        <div class="form-group">
          <label for="eng_lubeOilCapacity">Lube Oil Capacity</label>
          <input type="text" id="eng_lubeOilCapacity" value="340 Liters">
        </div>
        <div class="form-group">
          <label for="eng_coolingCapacity">Cooling Capacity</label>
          <input type="text" id="eng_coolingCapacity" value="450 Liters">
        </div>
        <div class="form-group">
          <label for="eng_currentHourMeter">Current Hour Meter</label>
          <input type="text" id="eng_currentHourMeter" value="42,850 hrs">
        </div>
        <div class="form-group">
          <label for="eng_targetOilTemp">Target Oil Temp</label>
          <input type="text" id="eng_targetOilTemp" value="180 - 195 °F">
        </div>
        <div class="form-group">
          <label for="eng_targetOilPress">Target Oil Press</label>
          <input type="text" id="eng_targetOilPress" value="45 ±5 PSI">
        </div>
      </div>

      <!-- PUMP FIELDS -->
      <div id="pumpFields" class="grid-3 hidden">
        <div class="form-group">
          <label for="pmp_pumpType">Pump Type</label>
          <input type="text" id="pmp_pumpType" value="Centrifugal / Multi-stage">
        </div>
        <div class="form-group">
          <label for="pmp_fluidHandled">Fluid Handled</label>
          <input type="text" id="pmp_fluidHandled" value="Crude Oil">
        </div>
        <div class="form-group">
          <label for="pmp_flowRate">Flow Rate</label>
          <input type="text" id="pmp_flowRate" value="250 m³/h (1100 GPM)">
        </div>
        <div class="form-group">
          <label for="pmp_totalDynamicHead">Total Dynamic Head (TDH)</label>
          <input type="text" id="pmp_totalDynamicHead" value="120 Meters">
        </div>
        <div class="form-group">
          <label for="pmp_suctionPressure">Suction Pressure</label>
          <input type="text" id="pmp_suctionPressure" value="30 PSI">
        </div>
        <div class="form-group">
          <label for="pmp_dischargePressure">Discharge Pressure</label>
          <input type="text" id="pmp_dischargePressure" value="180 PSI">
        </div>
        <div class="form-group">
          <label for="pmp_impellerDiameter">Impeller Diameter</label>
          <input type="text" id="pmp_impellerDiameter" value="210 mm">
        </div>
        <div class="form-group">
          <label for="pmp_sealType">Seal Type</label>
          <input type="text" id="pmp_sealType" value="Double Mechanical Seal">
        </div>
        <div class="form-group">
          <label for="pmp_npshRequired">NPSH Required</label>
          <input type="text" id="pmp_npshRequired" value="3.5 Meters">
        </div>
      </div>

      <!-- COMPRESSOR FIELDS -->
      <div id="cmpFields" class="grid-3 hidden">
        <div class="form-group">
          <label for="cmp_compressorType">Compressor Type</label>
          <input type="text" id="cmp_compressorType" value="Reciprocating Gas">
        </div>
        <div class="form-group">
          <label for="cmp_numberOfStages">Number of Stages</label>
          <input type="number" id="cmp_numberOfStages" value="2">
        </div>
        <div class="form-group">
          <label for="cmp_gasCapacity">Gas Capacity</label>
          <input type="text" id="cmp_gasCapacity" value="5.5 MMSCFD">
        </div>
        <div class="form-group">
          <label for="cmp_firstStageSuctionPress">1st Stage Suction Press</label>
          <input type="text" id="cmp_firstStageSuctionPress" value="20 PSI">
        </div>
        <div class="form-group">
          <label for="cmp_firstStageDischargePress">1st Stage Discharge Press</label>
          <input type="text" id="cmp_firstStageDischargePress" value="85 PSI">
        </div>
        <div class="form-group">
          <label for="cmp_secondStageDischargePress">2nd Stage Discharge Press</label>
          <input type="text" id="cmp_secondStageDischargePress" value="320 PSI">
        </div>
        <div class="form-group">
          <label for="cmp_dischargeTemperature">Discharge Temperature</label>
          <input type="text" id="cmp_dischargeTemperature" value="220 °F">
        </div>
        <div class="form-group">
          <label for="cmp_valveType">Valve Type</label>
          <input type="text" id="cmp_valveType" value="Concentric Ring Valves">
        </div>
        <div class="form-group">
          <label for="cmp_frameLubePressure">Frame Lube Pressure</label>
          <input type="text" id="cmp_frameLubePressure" value="55 PSI">
        </div>
      </div>
    </div>

    <!-- Materials -->
    <div class="card">
      <h3>Required Materials</h3>
      <table id="materialsTable">
        <thead>
          <tr>
            <th style="width: 10%;">Qty</th>
            <th style="width: 10%;">Unit</th>
            <th style="width: 20%;">Item No</th>
            <th style="width: 30%;">Description (EN)</th>
            <th style="width: 25%;">Description (AR)</th>
            <th style="width: 5%;"></th>
          </tr>
        </thead>
        <tbody id="materialsBody"></tbody>
      </table>
      <br>
      <button type="button" class="btn" onclick="addMaterialRow()">+ Add Item</button>
    </div>

    <button type="button" class="btn" onclick="generateJSON()">Generate Polymorphic JSON</button>
  </form>

  <br>
  <div class="card">
    <h3>JSON Output</h3>
    <pre id="jsonOutput">// Generated JSON will display here...</pre>
  </div>
</div>

<script>
  // Mock Database for QR records lookup
  const dbRecords = {
    "2803": {
      pmId: "2803",
      equipmentType: "ENGINE",
      asset: "Ras Bakr Gas Engine No 1",
      assetTag: "RBKR-ENG-10",
      manufacturer: "Waukesha",
      model: "L7042GSI",
      serial: "C-15420/1",
      jobPlan: "GSI70421",
      workOrder: "WO-2026-9941",
      pmFrequencySummary: "6 Months / 750 hrs",
      materials: [
        { quantity: 12, unit: "EA", itemNo: "185792", description: "Coil ignition shielded", descriptionAr: "ترانسات" },
        { quantity: 12, unit: "EA", itemNo: "125815", description: "Spark plug 4 gap", descriptionAr: "بوجيهات" },
        { quantity: 14, unit: "EA", itemNo: "110298", description: "Oil filter element", descriptionAr: "فلاتر زيت" }
      ]
    },
    "123456": {
      pmId: "123456",
      equipmentType: "PUMP",
      asset: "Crude Oil Transfer Pump No 2",
      assetTag: "RBKR-PMP-02",
      manufacturer: "C.O.P Gulden",
      model: "AX200",
      serial: "P-98412/A",
      jobPlan: "JP-PUMP-6M",
      workOrder: "WO-2026-1042",
      pmFrequencySummary: "6 Months / 1000 hrs",
      materials: [
        { quantity: 1, unit: "SET", itemNo: "402911", description: "Mechanical Seal Kit AX200", descriptionAr: "طقم مانع تسرب ميكانيكي" },
        { quantity: 2, unit: "EA", itemNo: "408112", description: "Bearing SKF 6314 C3", descriptionAr: "رولمان بلي" }
      ]
    },
    "78910": {
      pmId: "78910",
      equipmentType: "COMPRESSOR",
      asset: "Reciprocating Gas Compressor Unit 1",
      assetTag: "RBKR-CMP-01",
      manufacturer: "Ariel",
      model: "JJG/4",
      serial: "F-44102",
      jobPlan: "JP-COMP-3M",
      workOrder: "WO-2026-8820",
      pmFrequencySummary: "3 Months / 500 hrs",
      materials: [
        { quantity: 4, unit: "EA", itemNo: "501192", description: "Suction Valve Assembly", descriptionAr: "صمامات سحب" },
        { quantity: 1, unit: "SET", itemNo: "509122", description: "Piston Ring Set 1st Stage", descriptionAr: "طقم شنابر بستم" }
      ]
    }
  };

  // Extract URL parameters when page opens after QR Code scan
  function autoLoadFromQR() {
    const urlParams = new URLSearchParams(window.location.search);
    const pmId = urlParams.get('pmId') || '2803';
    const typeFromUrl = urlParams.get('equipmentType');

    loadAssetRecord(pmId, typeFromUrl);
  }

  function loadAssetRecord(pmId, typeOverride) {
    const data = dbRecords[pmId] || dbRecords["2803"];
    const finalType = (typeOverride || data.equipmentType).toUpperCase();

    // Fill Base Fields
    document.getElementById('pmId').value = data.pmId;
    document.getElementById('equipmentType').value = finalType;
    document.getElementById('asset').value = data.asset;
    document.getElementById('assetTag').value = data.assetTag;
    document.getElementById('manufacturer').value = data.manufacturer;
    document.getElementById('model').value = data.model;
    document.getElementById('serial').value = data.serial;
    document.getElementById('jobPlan').value = data.jobPlan;
    document.getElementById('workOrder').value = data.workOrder;
    document.getElementById('pmFrequencySummary').value = data.pmFrequencySummary;

    // Display Status Message
    document.getElementById('qrStatusText').innerHTML = 
      `<span style="color: green;">Loaded PM #${data.pmId} | Asset Category: <b>${finalType}</b></span>`;

    // Automatically render corresponding parameter sections
    renderDynamicFields(finalType);

    // Load Materials
    populateMaterials(data.materials);

    // Automatically generate JSON
    generateJSON();
  }

  function renderDynamicFields(type) {
    // Hide all containers
    document.getElementById('engineFields').classList.add('hidden');
    document.getElementById('pumpFields').classList.add('hidden');
    document.getElementById('cmpFields').classList.add('hidden');

    if (type === 'ENGINE') {
      document.getElementById('specsHeader').innerText = "Engine Technical Parameters";
      document.getElementById('engineFields').classList.remove('hidden');
    } else if (type === 'PUMP') {
      document.getElementById('specsHeader').innerText = "Pump Technical Parameters";
      document.getElementById('pumpFields').classList.remove('hidden');
    } else if (type === 'COMPRESSOR') {
      document.getElementById('specsHeader').innerText = "Compressor Technical Parameters";
      document.getElementById('cmpFields').classList.remove('hidden');
    }
  }

  function populateMaterials(items) {
    const tbody = document.getElementById('materialsBody');
    tbody.innerHTML = '';
    items.forEach(item => addMaterialRow(item));
  }

  function addMaterialRow(data = { quantity: 1, unit: 'EA', itemNo: '', description: '', descriptionAr: '' }) {
    const tbody = document.getElementById('materialsBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="number" class="mat-qty" value="${data.quantity}"></td>
      <td><input type="text" class="mat-unit" value="${data.unit}"></td>
      <td><input type="text" class="mat-itemNo" value="${data.itemNo}"></td>
      <td><input type="text" class="mat-desc" value="${data.description}"></td>
      <td><input type="text" dir="rtl" class="mat-descAr" value="${data.descriptionAr}"></td>
      <td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove()">X</button></td>
    `;
    tbody.appendChild(tr);
  }

  function generateJSON() {
    const pmId = document.getElementById('pmId').value;
    const equipmentType = document.getElementById('equipmentType').value;

    const record = {
      pmId: pmId,
      equipmentType: equipmentType,
      assetLocation: document.getElementById('assetLocation').value,
      asset: document.getElementById('asset').value,
      assetTag: document.getElementById('assetTag').value,
      manufacturer: document.getElementById('manufacturer').value,
      model: document.getElementById('model').value,
      serial: document.getElementById('serial').value,
      jobPlan: document.getElementById('jobPlan').value,
      workOrder: document.getElementById('workOrder').value,
      pmFrequencySummary: document.getElementById('pmFrequencySummary').value
    };

    if (equipmentType === 'ENGINE') {
      record.engineParameters = {
        ratedPower: document.getElementById('eng_ratedPower').value,
        operatingSpeed: document.getElementById('eng_operatingSpeed').value,
        fuelType: document.getElementById('eng_fuelType').value,
        cylindersCount: Number(document.getElementById('eng_cylindersCount').value),
        lubeOilCapacity: document.getElementById('eng_lubeOilCapacity').value,
        coolingCapacity: document.getElementById('eng_coolingCapacity').value,
        currentHourMeter: document.getElementById('eng_currentHourMeter').value,
        targetOilTemp: document.getElementById('eng_targetOilTemp').value,
        targetOilPress: document.getElementById('eng_targetOilPress').value
      };
    } else if (equipmentType === 'PUMP') {
      record.pumpParameters = {
        pumpType: document.getElementById('pmp_pumpType').value,
        fluidHandled: document.getElementById('pmp_fluidHandled').value,
        flowRate: document.getElementById('pmp_flowRate').value,
        totalDynamicHead: document.getElementById('pmp_totalDynamicHead').value,
        suctionPressure: document.getElementById('pmp_suctionPressure').value,
        dischargePressure: document.getElementById('pmp_dischargePressure').value,
        impellerDiameter: document.getElementById('pmp_impellerDiameter').value,
        sealType: document.getElementById('pmp_sealType').value,
        npshRequired: document.getElementById('pmp_npshRequired').value
      };
    } else if (equipmentType === 'COMPRESSOR') {
      record.compressorParameters = {
        compressorType: document.getElementById('cmp_compressorType').value,
        numberOfStages: Number(document.getElementById('cmp_numberOfStages').value),
        gasCapacity: document.getElementById('cmp_gasCapacity').value,
        firstStageSuctionPress: document.getElementById('cmp_firstStageSuctionPress').value,
        firstStageDischargePress: document.getElementById('cmp_firstStageDischargePress').value,
        secondStageDischargePress: document.getElementById('cmp_secondStageDischargePress').value,
        dischargeTemperature: document.getElementById('cmp_dischargeTemperature').value,
        valveType: document.getElementById('cmp_valveType').value,
        frameLubePressure: document.getElementById('cmp_frameLubePressure').value
      };
    }

    record.materials = [];
    document.querySelectorAll('#materialsBody tr').forEach(row => {
      record.materials.push({
        quantity: Number(row.querySelector('.mat-qty').value),
        unit: row.querySelector('.mat-unit').value,
        itemNo: row.querySelector('.mat-itemNo').value,
        description: row.querySelector('.mat-desc').value,
        descriptionAr: row.querySelector('.mat-descAr').value
      });
    });

    const rootJSON = {};
    rootJSON[pmId] = record;

    document.getElementById('jsonOutput').textContent = JSON.stringify(rootJSON, null, 2);
  }

  function simulateQRScan(pmId, equipmentType) {
    loadAssetRecord(pmId, equipmentType);
  }

  // Execute auto-loading on page load
  window.onload = autoLoadFromQR;
</script>

</body>
</html>
